# Theoria - Cloudflare Workers static assets deployment
# Serves web/ as-is as a static site (web/.assetsignore lists what is left
# out of the upload):
#   web app at /, bibles JSON at /bibles/WEB/, visuals at /visuals/,
#   narration at /audio/
name = "av-bible"
compatibility_date = "2026-01-01"

[assets]
directory = "./web"
