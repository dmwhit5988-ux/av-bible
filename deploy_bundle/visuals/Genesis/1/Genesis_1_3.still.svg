nd,</text><text x="570" y="463" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.647">and man in God's image</text><circle cx="570" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="587" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="604" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="621" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="638" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="655" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="672" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="689" cy="480" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="512" y="218" font-size="11" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588" font-style="italic">light</text><line x1="482" y1="234" x2="536" y2="234" stroke="rgb(74,70,56)" stroke-width="1.5" /><polygon points="542,234 534,229 534,239" fill="rgb(74,70,56)" /><text x="512" y="251" font-size="12" text-anchor="middle" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">1 → 4</text><text x="512" y="324" font-size="11" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588" font-style="italic">sky &amp; sea</text><line x1="482" y1="340" x2="536" y2="340" stroke="rgb(74,70,56)" stroke-width="1.5" /><polygon points="542,340 534,335 534,345" fill="rgb(74,70,56)" /><text x="512" y="357" font-size="12" text-anchor="middle" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">2 → 5</text><text x="512" y="430" font-size="11" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588" font-style="italic">land</text><line x1="482" y1="446" x2="536" y2="446" stroke="rgb(74,70,56)" stroke-width="1.5" /><polygon points="542,446 534,441 534,451" fill="rgb(74,70,56)" /><text x="512" y="463" font-size="12" text-anchor="middle" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">3 → 6</text><text x="40" y="500" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">EVENING AND MORNING</text><rect x="40" y="512" width="131.43" height="22" rx="3" fill="rgb(255,212,94)" /><text x="105.71" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(16,16,24)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">1</text><rect x="175.43" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="241.14" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">2</text><rect x="310.86" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="376.57" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">3</text><rect x="446.29" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="512" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">4</text><rect x="581.71" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="647.43" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">5</text><rect x="717.14" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="782.86" y="523" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">6</text><rect x="852.57" y="512" width="131.43" height="22" rx="3" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="918.29" y="523" font-size="12" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">7 · rest</text><text x="984" y="500" font-size="11" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Genesis 2:1–3</text><text x="984" y="550" font-size="12" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Formless and empty —</text><text x="984" y="565" font-size="12" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">form it, then fill it.</text><text x="28" y="558" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the forming/filling parallel is a reading of the chapter's structure, not part of the text</text></svg>