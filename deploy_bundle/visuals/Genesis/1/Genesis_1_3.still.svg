<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)" /><text x="28" y="20" font-size="24" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Genesis 1 — The Six Days: Forming and Filling</text><text x="28" y="54" font-size="16" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 3 — “Let there be light,” and there was light.</text><rect x="40" y="80" width="944" height="34" rx="4" fill="rgb(26,26,38)" stroke="rgb(138,129,95)" stroke-width="1.5" /><text x="54" y="97" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">In the beginning God created the heavens and the earth</text><text x="970" y="97" font-size="13" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 1</text><rect x="40" y="118" width="465" height="34" rx="4" fill="rgb(26,26,38)" stroke="rgb(138,129,95)" stroke-width="1.5" /><text x="54" y="135" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">the earth was FORMLESS</text><text x="491" y="135" font-size="13" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 2</text><rect x="519" y="118" width="465" height="34" rx="4" fill="rgb(26,26,38)" stroke="rgb(138,129,95)" stroke-width="1.5" /><text x="533" y="135" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">…and EMPTY</text><text x="970" y="135" font-size="13" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 2</text><line x1="255" y1="155" x2="255" y2="150" stroke="rgb(255,212,94)" stroke-width="2" /><polygon points="255,156 251,149 259,149" fill="rgb(255,212,94)" /><line x1="769" y1="155" x2="769" y2="150" stroke="rgb(74,70,56)" stroke-width="2" /><polygon points="769,156 765,149 773,149" fill="rgb(74,70,56)" /><text x="40" y="166" font-size="19" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">FORMING</text><text x="146" y="169" font-size="13" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">days 1–3  ·  the realms are made</text><text x="554" y="166" font-size="19" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">FILLING</text><text x="660" y="169" font-size="13" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588" font-style="italic">days 4–6  ·  the realms are filled</text><rect x="40" y="186" width="430" height="96" rx="5" fill="rgb(26,26,38)" /><polyline points="40,186 470,186 470,282 40,282 40,186" fill="none" stroke-linejoin="round" stroke="rgb(255,244,170)" stroke-width="2.5" stroke-opacity="0.949" /><text x="56" y="208" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">DAY 1</text><text x="122" y="208" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Light</text><text x="454" y="208" font-size="12" tex