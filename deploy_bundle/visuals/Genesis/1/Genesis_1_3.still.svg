24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="587" cy="268" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="604" cy="268" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="621" cy="268" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="638" cy="268" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="655" cy="268" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><rect x="40" y="292" width="430" height="96" rx="5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="56" y="314" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">DAY 2</text><text x="122" y="314" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Sky &amp; Sea</text><text x="454" y="314" font-size="12" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verses 6–8</text><text x="56" y="338" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.647">an expanse divides the waters above</text><text x="56" y="357" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.647">from the waters below</text><circle cx="56" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="73" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="90" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><rect x="554" y="292" width="430" height="96" rx="5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="570" y="314" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">DAY 5</text><text x="636" y="314" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Birds &amp; Fish</text><text x="968" y="314" font-size="12" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verses 20–23</text><text x="570" y="338" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.647">swarms fill the seas, and birds fly</text><text x="570" y="357" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.647">in the open expanse of the sky</text><circle cx="570" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="587" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="604" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><circle cx="621" cy="374" r="3.5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><rect x="40" y="398" width="430" height="96" rx="5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5" /><text x="56" y="420" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">DAY 3</text><text x="122" y="420" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Land &amp; Plants</text><text x="454" y="4