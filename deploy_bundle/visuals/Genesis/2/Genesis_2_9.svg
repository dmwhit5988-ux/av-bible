<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)"/><text x="28" y="20" font-size="24" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Genesis 2 — The Garden Eastward in Eden</text><text x="28" y="54" font-size="16" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 9 — Every good tree grew — and in the middle, life, and knowledge of good and evil.</text><text x="28" y="558" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">a plan of what the chapter describes, not a map — only the Hiddekel (Tigris) and Euphrates can be placed on the ground</text><rect x="24" y="86" width="664" height="470" fill="none" stroke="rgb(74,70,56)" stroke-width="1"/><text x="676" y="100" font-size="12" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">east  →</text><line x1="32" y1="532" x2="680" y2="532" stroke="rgb(58,48,38)" stroke-width="10" stroke-opacity="0.824"/><ellipse cx="250" cy="320" rx="140" ry="118" fill="rgb(52,70,50)" fill-opacity="0.471" stroke="rgb(52,70,50)" stroke-width="2"/><text x="250" y="190" font-size="14" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">THE GARDEN IN EDEN</text><circle cx="146" cy="268" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="132" cy="346" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="192" cy="232" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="288" cy="228" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="346" cy="262" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="362" cy="342" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="296" cy="404" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="220" cy="412" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="126" cy="312" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="364" cy="306" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><polyline points="38,108 74,152 100,208 110,262 114,300 180,312 250,320 330,328 400,336" stroke-linejoin="round" fill="none" stroke="rgb(74,70,56)" stroke-width="1.5" stroke-dasharray="5,6"/><text x="42" y="94" font-size="13" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">a river went out of Eden</text><polyline points="400,336 444,282 476,206 520,162" stroke-linejoin="round" fill="none" stroke="rgb(74,70,56)" stroke-width="1" stroke-opacity="0.627" stroke-dasharray="4,7"/><rect x="520" y="140" width="160" height="44" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="532" y="155" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">1. Pishon</text><text x="532" y="172" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the whole land of Havilah</text><polyline points="400,336 452,308 486,268 520,250" stroke-linejoin="round" fill="none" stroke="rgb(74,70,56)" stroke-width="1" stroke-opacity="0.627" stroke-dasharray="4,7"/><rect x="520" y="228" width="160" height="44" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="532" y="243" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">2. Gihon</text><text x="532" y="260" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the whole land of Cush</text><polyline points="400,336 456,342 520,338" stroke-linejoin="round" fill="none" stroke="rgb(74,70,56)" stroke-width="1" stroke-opacity="0.627" stroke-dasharray="4,7"/><rect x="520" y="316" width="160" height="44" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="532" y="331" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">3. Hiddekel</text><text x="532" y="348" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">in front of Assyria</text><polyline points="400,336 446,382 488,416 520,426" stroke-linejoin="round" fill="none" stroke="rgb(74,70,56)" stroke-width="1" stroke-opacity="0.627" stroke-dasharray="4,7"/><rect x="520" y="404" width="160" height="44" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="532" y="419" font-size="16" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">4. Euphrates</text><text x="532" y="436" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the fourth river</text><rect x="197" y="274" width="6" height="24" fill="rgb(255,212,94)"/><circle cx="200" cy="266" r="21" fill="rgb(86,122,78)" stroke="rgb(255,244,170)" stroke-width="2.5"/><circle cx="200" cy="266" r="27" fill="none" stroke="rgb(255,244,170)" stroke-width="2" stroke-opacity="0.847"/><text x="200" y="224" font-size="14" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">the tree of life</text><rect x="319" y="318" width="6" height="24" fill="rgb(255,212,94)"/><circle cx="322" cy="310" r="21" fill="rgb(86,122,78)" stroke="rgb(255,244,170)" stroke-width="2.5"/><circle cx="322" cy="310" r="27" fill="none" stroke="rgb(255,244,170)" stroke-width="2" stroke-opacity="0.847"/><text x="322" y="268" font-size="14" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">the knowledge of good and evil</text><circle cx="176" cy="377" r="5" fill="rgb(140,130,100)"/><line x1="176" y1="383" x2="176" y2="396" stroke="rgb(140,130,100)" stroke-width="2.5"/><line x1="170" y1="387" x2="182" y2="387" stroke="rgb(140,130,100)" stroke-width="2.5"/><line x1="176" y1="396" x2="171" y2="405" stroke="rgb(140,130,100)" stroke-width="2.5"/><line x1="176" y1="396" x2="181" y2="405" stroke="rgb(140,130,100)" stroke-width="2.5"/><text x="176" y="420" font-size="13" text-anchor="middle" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">the man</text><text x="712" y="92" font-size="19" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">IN THE GARDEN</text><line x1="720" y1="128" x2="720" y2="491" stroke="rgb(74,70,56)" stroke-width="2"/><circle cx="720" cy="128" r="4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="122" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">The seventh day</text><text x="736" y="136" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">finished, blessed, made holy</text><text x="1004" y="122" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">1–3</text><circle cx="720" cy="161" r="4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="155" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">Before the rain</text><text x="736" y="169" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">no plant, no man — only a mist</text><text x="1004" y="155" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">4–6</text><circle cx="720" cy="194" r="4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="188" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">The man formed</text><text x="736" y="202" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">dust of the ground, breath of life</text><text x="1004" y="188" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">7</text><circle cx="720" cy="227" r="4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="221" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">A garden eastward</text><text x="736" y="235" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">planted in Eden; the man put there</text><text x="1004" y="221" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">8</text><circle cx="720" cy="260" r="6" fill="rgb(255,244,170)" stroke="rgb(16,16,24)" stroke-width="1"/><text x="736" y="254" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Two trees in the middle</text><text x="736" y="268" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">life — and knowledge of good and evil</text><text x="1004" y="254" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">9</text><circle cx="720" cy="293" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="287" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">One river, four heads</text><text x="736" y="301" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Pishon, Gihon, Hiddekel, Euphrates</text><text x="1004" y="287" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">10–14</text><circle cx="720" cy="326" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="320" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">To cultivate and keep</text><text x="736" y="334" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the garden given as work</text><text x="1004" y="320" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">15</text><circle cx="720" cy="359" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="353" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">The one command</text><text x="736" y="367" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">eat freely — but not of that tree</text><text x="1004" y="353" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">16–17</text><circle cx="720" cy="392" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="386" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">Not good to be alone</text><text x="736" y="400" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">I will make him a helper</text><text x="1004" y="386" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">18</text><circle cx="720" cy="425" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="419" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">The naming</text><text x="736" y="433" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">every animal and bird brought to him</text><text x="1004" y="419" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">19–20</text><circle cx="720" cy="458" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="452" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">The woman</text><text x="736" y="466" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">taken from his side — bone of my bones</text><text x="1004" y="452" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">21–23</text><circle cx="720" cy="491" r="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="736" y="485" font-size="14" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">One flesh</text><text x="736" y="499" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">and they were not ashamed</text><text x="1004" y="485" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">24–25</text></svg>