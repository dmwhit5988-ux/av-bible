<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="parch" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#f6efdd"/>
      <stop offset="100%" stop-color="#e9dcbe"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cf7e"/>
      <stop offset="55%" stop-color="#d3a13c"/>
      <stop offset="100%" stop-color="#b0801f"/>
    </linearGradient>
    <radialGradient id="panelbg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#6d2430"/>
      <stop offset="100%" stop-color="#471420"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#parch)"/>

  <!-- illuminated panel -->
  <rect x="242" y="52" width="156" height="156" fill="url(#panelbg)"/>
  <rect x="242" y="52" width="156" height="156" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="252" y="62" width="136" height="136" fill="none" stroke="#d3a13c" stroke-width="1"/>

  <!-- corner diamonds -->
  <g fill="#d3a13c">
    <rect x="237" y="47" width="10" height="10" transform="rotate(45 242 52)"/>
    <rect x="393" y="47" width="10" height="10" transform="rotate(45 398 52)"/>
    <rect x="237" y="203" width="10" height="10" transform="rotate(45 242 208)"/>
    <rect x="393" y="203" width="10" height="10" transform="rotate(45 398 208)"/>
  </g>

  <!-- gold-dot ornament inside panel corners -->
  <g fill="#e8c56d" opacity="0.8">
    <circle cx="262" cy="72" r="2.2"/>
    <circle cx="378" cy="72" r="2.2"/>
    <circle cx="262" cy="188" r="2.2"/>
    <circle cx="378" cy="188" r="2.2"/>
  </g>

  <!-- the illuminated theta initial -->
  <text x="320" y="167" fill="url(#gold)" font-size="104" text-anchor="middle">&#x0398;</text>

  <!-- wordmark: THE(theta)RIA -->
  <g fill="#3a2c1e" font-size="44" text-anchor="middle">
    <text x="164" y="288">T</text>
    <text x="216" y="288">H</text>
    <text x="268" y="288">E</text>
    <text x="372" y="288">R</text>
    <text x="424" y="288">I</text>
    <text x="476" y="288">A</text>
  </g>
  <text x="320" y="288" fill="url(#gold)" font-size="44" text-anchor="middle">&#x0398;</text>

  <line x1="200" y1="316" x2="440" y2="316" stroke="#b0801f" stroke-width="1" opacity="0.6"/>
  <text x="320" y="348" fill="#5a4630" font-size="14" text-anchor="middle" letter-spacing="4">A VISUAL BIBLE</text>
</svg>
