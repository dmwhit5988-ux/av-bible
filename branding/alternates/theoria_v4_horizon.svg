<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1d"/>
      <stop offset="62%" stop-color="#182137"/>
      <stop offset="100%" stop-color="#2b2c3f"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6d992" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#e8b45c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8b45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>

  <!-- dawn glow at the horizon -->
  <ellipse cx="320" cy="168" rx="190" ry="95" fill="url(#dawn)">
    <animate attributeName="rx" values="180;200;180" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- horizon line, running through the theta -->
  <line x1="60" y1="168" x2="256" y2="168" stroke="#caa658" stroke-width="1" opacity="0.45"/>
  <line x1="384" y1="168" x2="580" y2="168" stroke="#caa658" stroke-width="1" opacity="0.45"/>

  <!-- the theta: a sun on the horizon, its bar IS the horizon -->
  <circle cx="320" cy="168" r="52" fill="none" stroke="#eccb7b" stroke-width="2.5"/>
  <line x1="272" y1="168" x2="368" y2="168" stroke="#eccb7b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- wordmark: THE(theta)RIA, the O drawn as a mini sun-theta -->
  <g fill="#e9e4d6" font-size="36" font-weight="300" text-anchor="middle">
    <text x="185" y="291">T</text>
    <text x="230" y="291">H</text>
    <text x="275" y="291">E</text>
    <text x="365" y="291">R</text>
    <text x="410" y="291">I</text>
    <text x="455" y="291">A</text>
  </g>
  <circle cx="320" cy="279" r="13.5" fill="none" stroke="#eccb7b" stroke-width="2"/>
  <line x1="308" y1="279" x2="332" y2="279" stroke="#eccb7b" stroke-width="2" stroke-linecap="round"/>

  <text x="320" y="336" fill="#e9e4d6" opacity="0.45" font-size="12" text-anchor="middle" letter-spacing="5">SEE THE WORD</text>
</svg>
