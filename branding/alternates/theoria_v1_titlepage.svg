<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="parch" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#f8f2e2"/>
      <stop offset="100%" stop-color="#ece0c6"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b45c"/>
      <stop offset="55%" stop-color="#c4922e"/>
      <stop offset="100%" stop-color="#a2731f"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#parch)"/>

  <!-- small Greek above, like a scholarly epigraph -->
  <text x="320" y="118" fill="#5a4c38" font-size="24" text-anchor="middle" letter-spacing="6">&#x03B8;&#x03B5;&#x03C9;&#x03C1;&#x03B9;&#x03B1;</text>

  <!-- double rule -->
  <line x1="150" y1="146" x2="490" y2="146" stroke="#2e2820" stroke-width="1.6"/>
  <line x1="150" y1="152" x2="490" y2="152" stroke="#2e2820" stroke-width="0.6"/>

  <!-- wordmark: THE(theta)RIA -->
  <g fill="#2e2820" font-size="66" text-anchor="middle">
    <text x="140" y="230">T</text>
    <text x="200" y="230">H</text>
    <text x="260" y="230">E</text>
    <text x="380" y="230">R</text>
    <text x="440" y="230">I</text>
    <text x="500" y="230">A</text>
  </g>
  <text x="320" y="230" fill="url(#gold)" font-size="66" text-anchor="middle">&#x0398;</text>

  <!-- double rule -->
  <line x1="150" y1="258" x2="490" y2="258" stroke="#2e2820" stroke-width="0.6"/>
  <line x1="150" y1="264" x2="490" y2="264" stroke="#2e2820" stroke-width="1.6"/>

  <!-- tagline with flanking diamonds -->
  <rect x="146" y="303" width="7" height="7" fill="#c4922e" transform="rotate(45 149.5 306.5)"/>
  <text x="320" y="312" fill="#5a4c38" font-size="14" text-anchor="middle" letter-spacing="4">AND WE BEHELD HIS GLORY</text>
  <rect x="487" y="303" width="7" height="7" fill="#c4922e" transform="rotate(45 490.5 306.5)"/>
</svg>
