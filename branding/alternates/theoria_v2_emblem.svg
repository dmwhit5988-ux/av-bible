<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="100%" stop-color="#0c1020"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d488"/>
      <stop offset="55%" stop-color="#d9a94a"/>
      <stop offset="100%" stop-color="#b8842e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#f2c96a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f2c96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- glow behind the emblem -->
  <circle cx="320" cy="148" r="105" fill="url(#glow)">
    <animate attributeName="r" values="98;112;98" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- rays -->
  <g stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="320" y1="58" x2="320" y2="42"/>
    <line x1="366" y1="70" x2="374" y2="56"/>
    <line x1="400" y1="102" x2="414" y2="94"/>
    <line x1="412" y1="148" x2="428" y2="148"/>
    <line x1="400" y1="194" x2="414" y2="202"/>
    <line x1="366" y1="226" x2="374" y2="240"/>
    <line x1="320" y1="238" x2="320" y2="254"/>
    <line x1="274" y1="226" x2="266" y2="240"/>
    <line x1="240" y1="194" x2="226" y2="202"/>
    <line x1="228" y1="148" x2="212" y2="148"/>
    <line x1="240" y1="102" x2="226" y2="94"/>
    <line x1="274" y1="70" x2="266" y2="56"/>
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- the theta, drawn: ring + crossbar = the eye of contemplation -->
  <ellipse cx="320" cy="148" rx="62" ry="74" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <line x1="266" y1="148" x2="374" y2="148" stroke="#d9a94a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="320" cy="128" r="5" fill="#ffe9b0" opacity="0.9"/>

  <!-- wordmark: THE(theta)RIA -->
  <g fill="#e8ddc4" font-size="38" text-anchor="middle">
    <text x="182" y="308">T</text>
    <text x="228" y="308">H</text>
    <text x="274" y="308">E</text>
    <text x="366" y="308">R</text>
    <text x="412" y="308">I</text>
    <text x="458" y="308">A</text>
  </g>
  <text x="320" y="308" fill="url(#gold)" font-size="38" text-anchor="middle">&#x0398;</text>

  <text x="320" y="352" fill="#e8ddc4" opacity="0.5" font-size="13" text-anchor="middle" letter-spacing="3">BEHOLD THE WORD</text>
</svg>
