9b7a" font-style="italic">of birds</text><text x="3486" y="2258" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#a59b7a">—</text><text x="3846" y="2258" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#d8c68f">around the altar</text><line x1="2970" y1="2419" x2="4900" y2="2419" stroke="#4c483f" stroke-width="1.2"/><text x="2978" y="2447" font-size="15" text-anchor="start" dominant-baseline="central" fill="#a59b7a" font-weight="bold">WHO EATS</text><text x="3126" y="2447" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#d8c68f">no one</text><text x="3486" y="2447" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#d8c68f">the priests</text><text x="3486" y="2467" font-size="14" text-anchor="start" dominant-baseline="central" fill="#a59b7a" font-style="italic">Aaron and his sons</text><line x1="2970" y1="2608" x2="4900" y2="2608" stroke="#4c483f" stroke-width="1.2"/><text x="2978" y="2636" font-size="15" text-anchor="start" dominant-baseline="central" fill="#a59b7a" font-weight="bold">NOT EATEN</text><text x="3486" y="2636" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#d8c68f">a priest's own</text><text x="3846" y="2636" font-size="17.5" text-anchor="start" dominant-baseline="central" fill="#d8c68f">the fat, the blood</text><g stroke-width="3.619"><rect x="590" y="300" width="1680" height="980" rx="40" fill="none" stroke="#4a4638" stroke-width="3" stroke-dasharray="18 14"/></g><path d="M3480 2487h340v25h-340zM3480 2512h340v21h-340zM3480 2540h340v25h-340zM3480 2565h340v21h-340zM3840 2434h340v25h-340zM3840 2459h340v21h-340zM3840 2487h340v25h-340zM3840 2512h340v21h-340zM3840 2540h340v25h-340zM3840 2565h340v21h-340zM4200 2434h340v25h-340zM4200 2459h340v21h-340zM3120 2623h340v25h-340zM3840 2657h340v25h-340zM4200 2657h340v25h-340z" fill="#1a1a26"/><path d="M3490 2500h112M3490 2520h112M3490 2553h112M3490 2573h112M3850 2447h112M3850 2467h112M3850 2500h112M3850 