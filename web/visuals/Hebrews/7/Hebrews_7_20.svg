b(140,130,100)" stroke-width="1.6" stroke-opacity="0.800"/><text x="739" y="238" font-size="7.5" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.800">ISSACHAR</text><rect x="780" y="218" width="62" height="40" rx="2" fill="none" stroke="rgb(140,130,100)" stroke-width="1.6" stroke-opacity="0.800"/><text x="811" y="238" font-size="7.5" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.800">ZEBULUN</text><rect x="852" y="218" width="62" height="40" rx="2" fill="none" stroke="rgb(140,130,100)" stroke-width="1.6" stroke-opacity="0.800"/><text x="883" y="238" font-size="7.5" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.800">JOSEPH</text><rect x="924" y="218" width="62" height="40" rx="2" fill="none" stroke="rgb(140,130,100)" stroke-width="1.6" stroke-opacity="0.800"/><text x="955" y="238" font-size="7.5" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.800">BENJAMIN</text><text x="132" y="282" font-size="9.5" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.898" font-style="italic">he of whom these things are said belongs to another tribe</text><line x1="379" y1="300" x2="379" y2="262" stroke="rgb(255,244,170)" stroke-width="2"/><line x1="379" y1="262" x2="375.74" y2="269.3" stroke="rgb(255,244,170)" stroke-width="2"/><line x1="379" y1="262" x2="382.26" y2="269.3" stroke="rgb(255,244,170)" stroke-width="2"/><text x="379" y="316" font-size="9.5" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">OUR LORD SPRANG OUT OF JUDAH</text><text x="379" y="332" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-style="italic">of which tribe Moses spoke nothing concerning priesthood</text><text x="132" y="360" font-size="9.5" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">not after a fleshly commandment, but after the power of an endless life</text><rect x="132" y="384" width="300" height="34" rx="3" fill="none" stroke="rgb(176,180,190)" stroke-width="1.5" stroke-opacity="0.800"/><text x="282" y="401" font-size="9.5" text-anchor="middle" dominant-baseline="central" fill="rgb(176,180,190)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.898" font-weight="bold">A FOREGOING COMMANDMENT</text><line x1="126" y1="401" x2="438" y2="401" stroke="rgb(170,70,60)" stroke-width="2.4" stroke-opacity="0.898"/><text x="132" y="432" font-size="9" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-style="italic">weakness and uselessness — the law made nothing perfect</text><line x1="446" y1="401" x2="556" y2="401" stroke="rgb(255,244,170)" stroke-width="2"/><line x1="556" y1="401" x2="548.7" y2="397.74" stroke="rgb(255,244,170)" stroke-width="2"/><line x1="556" y1="401" x2="548.7" y2="404.26" stroke="rgb(255,244,170)" stroke-width="2"/><rect x="566" y="384" width="300" height="34" rx="3" fill="none" stroke="rgb(255,244,170)" stroke-width="1.8"/><text x="716" y="401" font-size="11" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">A BETTER HOPE</text><text x="716" y="432" font-size="9.5" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">through which we