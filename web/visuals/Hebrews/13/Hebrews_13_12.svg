<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)"/><text x="28" y="24" font-size="23" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Hebrews 13</text><text x="28" y="54" font-size="13" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.847" font-style="italic">v12</text><line x1="104" y1="438.18" x2="1000" y2="438.18" stroke="rgb(96,104,124)" stroke-width="1.8" stroke-opacity="0.800"/><text x="112" y="426.18" font-size="9.5" text-anchor="start" dominant-baseline="central" fill="rgb(96,104,124)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-weight="bold">THE CAMP</text><text x="112" y="168" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">we have an altar</text><text x="112" y="186" font-size="9.5" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-style="italic">from which those who serve the tabernacle have no right to eat</text><text x="112" y="212" font-size="9.5" text-anchor="start" dominant-baseline="central" fill="rgb(168,62,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-style="italic">their bodies are burned OUTSIDE OF THE CAMP</text><text x="112" y="232" font-size="10" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">therefore Jesus also suffered OUTSIDE OF THE GATE</text><line x1="52" y1="92" x2="52" y2="540" stroke="rgb(74,70,56)" stroke-width="1.4" stroke-opacity="0.847"/><line x1="47" y1="513.12" x2="57" y2="513.12" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="472.8" x2="57" y2="472.8" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="428" x2="57" y2="428" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="365.28" x2="57" y2="365.28" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="324.96" x2="57" y2="324.96" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="295.84" x2="57" y2="295.84" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="223.71" x2="57" y2="223.71" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="181.6" x2="57" y2="181.6" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="136.8" x2="57" y2="136.8" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><rect x="44" y="244.32" width="16" height="295.68" rx="3" fill="none" stroke="rgb(255,244,170)" stroke-width="1.6" stroke-opacity="0.847"/></svg>