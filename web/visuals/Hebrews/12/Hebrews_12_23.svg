<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)"/><text x="28" y="24" font-size="23" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Hebrews 12</text><text x="28" y="54" font-size="13" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.847" font-style="italic">v23</text><text x="112" y="122" font-size="17" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">TWO MOUNTAINS</text><polygon points="112,470 302,210 492,470" fill="rgb(120,88,58)" fill-opacity="0.137" stroke="rgb(216,124,58)" stroke-width="2" stroke-opacity="0.949"/><text x="302" y="492" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-weight="bold">SINAI</text><text x="302" y="250" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">a mountain that might be touched</text><text x="302" y="280" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">burned with fire</text><text x="302" y="310" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">blackness, darkness, storm</text><text x="302" y="340" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">the sound of a trumpet</text><text x="302" y="370" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">the voice of words</text><text x="302" y="400" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">if even an animal touches it</text><text x="302" y="430" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">I am terrified and trembling</text><polygon points="612,470 802,210 992,470" fill="rgb(226,198,130)" fill-opacity="0.137" stroke="rgb(226,198,130)" stroke-width="2" stroke-opacity="0.949"/><text x="802" y="492" font-size="13" text-anchor="middle" dominant-baseline="central" fill="rgb(226,198,130)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-weight="bold">ZION</text><text x="802" y="250" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(226,198,130)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">Mount Zion, the city of the living God</text><text x="802" y="280" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(226,198,130)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">the heavenly Jerusalem</text><text x="802" y="310" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(226,198,130)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949">innumerable multitudes of angels</text><text x="802" y="340" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">the festal gathering of the firstborn</text><text x="802" y="370" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">God the Judge of all</text><text x="802" y="400" font-size="8.5" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">the spirits of just men made perfect</text><text x="112" y="144" font-size="10.5" text-anchor="start" dominant-baseline="central" fill="rgb(216,124,58)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.949" font-style="italic">you have NOT come to a mountain that might be touched</text><text x="112" y="164" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">BUT YOU HAVE COME TO MOUNT ZION</text><line x1="52" y1="92" x2="52" y2="540" stroke="rgb(74,70,56)" stroke-width="1.4" stroke-opacity="0.847"/><line x1="47" y1="513.12" x2="57" y2="513.12" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="472.8" x2="57" y2="472.8" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="428" x2="57" y2="428" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="365.28" x2="57" y2="365.28" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="324.96" x2="57" y2="324.96" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="295.84" x2="57" y2="295.84" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="223.71" x2="57" y2="223.71" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="181.6" x2="57" y2="181.6" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><line x1="47" y1="136.8" x2="57" y2="136.8" stroke="rgb(74,70,56)" stroke-width="1.2" stroke-opacity="0.898"/><text x="52" y="76" font-size="9" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.898" font-style="italic">OFF</text></svg>