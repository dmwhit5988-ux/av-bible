<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)"/><text x="28" y="20" font-size="24" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Genesis 3 — The Garden Undone</text><text x="28" y="54" font-size="15" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 19 — “By the sweat of your face — for you are dust, and to dust you shall return.”</text><text x="28" y="564" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the reversals down the right are Genesis 2 read against Genesis 3 — a reading of the chapter, not part of the text</text><text x="32" y="176" font-size="15" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">THREE SENTENCES</text><text x="220" y="179" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">man and woman were questioned; serpent, woman, man are sentenced</text><rect x="36" y="196" width="210" height="300" rx="5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="141" y="214" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">THE SERPENT</text><circle cx="52" cy="244" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="244" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">cursed above all livestock</text><circle cx="52" cy="270" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="270" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">on your belly you shall go</text><circle cx="52" cy="296" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="296" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">you shall eat dust all your days</text><circle cx="52" cy="322" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="322" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">hostility with the woman</text><circle cx="52" cy="348" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="348" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">he will bruise your head</text><circle cx="52" cy="374" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="64" y="374" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">you will bruise his heel</text><rect x="258" y="196" width="210" height="300" rx="5" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="363" y="214" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">THE WOMAN</text><circle cx="274" cy="244" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="286" y="244" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">pain in childbirth, multiplied</text><circle cx="274" cy="270" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="286" y="270" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">in pain you will bear children</text><circle cx="274" cy="296" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="286" y="296" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">your desire for your husband</text><circle cx="274" cy="322" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="286" y="322" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">and he will rule over you</text><rect x="480" y="196" width="210" height="300" rx="5" fill="rgb(26,26,38)" stroke="rgb(255,212,94)" stroke-width="1.5"/><text x="585" y="214" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">THE MAN</text><circle cx="496" cy="244" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="244" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">the ground is cursed for your sake</text><circle cx="496" cy="270" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="270" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">you will eat from it with much labor</text><circle cx="496" cy="296" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="296" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">it will yield thorns and thistles</text><circle cx="496" cy="322" r="3.4" fill="rgb(138,129,95)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="322" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">you will eat the herb of the field</text><circle cx="496" cy="348" r="5" fill="rgb(255,244,170)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="348" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">by the sweat of your face</text><circle cx="496" cy="374" r="5" fill="rgb(255,244,170)" stroke="rgb(74,70,56)" stroke-width="1.2"/><text x="508" y="374" font-size="12" text-anchor="start" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">to dust you shall return</text><polyline points="160,452 360,452" stroke-linejoin="round" fill="none" stroke="rgb(255,212,94)" stroke-width="1.5" stroke-opacity="0.588" stroke-dasharray="5,5"/><text x="260" y="442" font-size="12" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">her offspring and yours</text><text x="150" y="466" font-size="11" text-anchor="end" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">his heel</text><text x="370" y="466" font-size="11" text-anchor="start" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">your head</text><line x1="32" y1="512" x2="692" y2="512" stroke="rgb(58,48,38)" stroke-width="9" stroke-opacity="0.863"/><polyline points="496,508 490,492 501,482 493,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="524,508 518,492 529,482 521,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="552,508 546,492 557,482 549,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="580,508 574,492 585,482 577,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="608,508 602,492 613,482 605,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="636,508 630,492 641,482 633,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="664,508 658,492 669,482 661,468" stroke-linejoin="round" fill="none" stroke="rgb(120,88,58)" stroke-width="1.8" stroke-opacity="0.784"/><polyline points="586,500 586,508" stroke-linejoin="round" fill="none" stroke="rgb(255,212,94)" stroke-width="2"/><polygon points="586,514 581,504 591,504" fill="rgb(255,212,94)"/><text x="586" y="528" font-size="12" text-anchor="middle" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">dust</text><rect x="36" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="111" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">the serpent</text><rect x="200" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="275" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">the woman</text><rect x="364" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(255,212,94)" stroke-width="1.5"/><text x="439" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">the man</text><text x="439" y="128" font-size="10" text-anchor="middle" dominant-baseline="central" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">hears</text><rect x="528" y="96" width="150" height="42" rx="4" fill="rgb(26,26,38)"/><rect x="528" y="96" width="150" height="42" rx="4" fill="none" stroke="rgb(255,244,170)" stroke-width="2.5" stroke-opacity="0.949"/><text x="603" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Yahweh God</text><text x="603" y="128" font-size="10" text-anchor="middle" dominant-baseline="central" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">speaks</text><path d="M439.0,138 Q357.0,164 275.0,138" fill="none" stroke="rgb(138,129,95)" stroke-width="1.5" stroke-opacity="0.745"/><polygon points="275,138 282,146 287,139" fill="rgb(138,129,95)" fill-opacity="0.745"/><path d="M275.0,138 Q193.0,164 111.0,138" fill="none" stroke="rgb(138,129,95)" stroke-width="1.5" stroke-opacity="0.745"/><polygon points="111,138 118,146 123,139" fill="rgb(138,129,95)" fill-opacity="0.745"/><path d="M603.0,138 Q521.0,164 439.0,138" fill="none" stroke="rgb(255,244,170)" stroke-width="2.5" stroke-opacity="0.898"/><polygon points="439,138 446,146 451,139" fill="rgb(255,244,170)" fill-opacity="0.898"/><text x="716" y="92" font-size="18" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">WHAT IS UNDONE</text><text x="716" y="114" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Genesis 2, and the verse that reverses it</text><text x="720" y="142" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">naked, and not ashamed</text><text x="720" y="157" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(138,129,95)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="157" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">coverings of fig leaves</text><text x="1008" y="157" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:25 → 3:7</text><text x="720" y="200" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">God walking in the garden</text><text x="720" y="215" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(138,129,95)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="215" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">hidden among the trees</text><text x="1008" y="215" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">3:8</text><text x="720" y="258" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">eat freely of every tree</text><text x="720" y="273" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(138,129,95)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="273" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">you ate of the one tree</text><text x="1008" y="273" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:16 → 3:12</text><text x="720" y="316" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">to cultivate it and keep it</text><text x="720" y="331" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(138,129,95)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="331" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">thorns, thistles, and sweat</text><text x="1008" y="331" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:15 → 3:18</text><text x="720" y="374" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the breath of life</text><text x="720" y="389" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="389" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">to dust you shall return</text><text x="1008" y="389" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">2:7 → 3:19</text><rect x="710" y="368" width="304" height="44" rx="3" fill="none" stroke="rgb(255,244,170)" stroke-width="1.5" stroke-opacity="0.698"/><text x="720" y="432" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">the tree of life at hand</text><text x="720" y="447" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="447" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">a sword guards the way</text><text x="1008" y="447" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:9 → 3:24</text></svg>