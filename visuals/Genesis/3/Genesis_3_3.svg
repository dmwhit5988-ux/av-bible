<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Georgia, 'Times New Roman', serif"><rect x="0" y="0" width="1024" height="576" fill="rgb(16,16,24)"/><text x="28" y="20" font-size="24" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Genesis 3 — The Garden Undone</text><text x="28" y="54" font-size="15" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">verse 3 — but not the tree in the middle — you shall not eat, nor touch, lest you die.”</text><text x="28" y="564" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the reversals down the right are Genesis 2 read against Genesis 3 — a reading of the chapter, not part of the text</text><ellipse cx="330" cy="355" rx="200" ry="128" fill="rgb(52,70,50)" fill-opacity="0.431" stroke="rgb(52,70,50)" stroke-width="2"/><text x="330" y="215" font-size="13" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">THE GARDEN IN EDEN</text><circle cx="180" cy="295" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="272" cy="259" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="376" cy="257" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="470" cy="305" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="486" cy="385" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="390" cy="451" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="284" cy="455" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><circle cx="170" cy="375" r="11" fill="rgb(86,122,78)" fill-opacity="0.510" stroke="rgb(52,70,50)" stroke-width="1"/><line x1="32" y1="512" x2="692" y2="512" stroke="rgb(58,48,38)" stroke-width="9" stroke-opacity="0.863"/><rect x="211" y="362" width="8" height="10" fill="rgb(120,88,58)"/><circle cx="215" cy="340" r="24" fill="rgb(86,122,78)" fill-opacity="0.922" stroke="rgb(52,70,50)" stroke-width="1.5"/><text x="215" y="306" font-size="13" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">the tree of life</text><rect x="396" y="390" width="8" height="10" fill="rgb(255,212,94)"/><circle cx="400" cy="358" r="34" fill="rgb(86,122,78)" fill-opacity="0.922" stroke="rgb(255,244,170)" stroke-width="2.5"/><line x1="383" y1="341" x2="417" y2="375" stroke="rgb(170,70,60)" stroke-width="3"/><line x1="417" y1="341" x2="383" y2="375" stroke="rgb(170,70,60)" stroke-width="3"/><text x="400" y="314" font-size="13" text-anchor="middle" dominant-baseline="text-after-edge" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">knowledge of good and evil</text><polyline points="432,340 410,330 388,338 366,352 348,372 336,396 332,420" stroke-linejoin="round" fill="none" stroke="rgb(138,129,95)" stroke-width="3" stroke-opacity="0.784"/><circle cx="332" cy="420" r="4.5" fill="rgb(255,244,170)"/><circle cx="320" cy="433" r="5.5" fill="rgb(255,244,170)"/><line x1="320" y1="440" x2="320" y2="455" stroke="rgb(255,244,170)" stroke-width="2.6"/><line x1="313" y1="445" x2="327" y2="445" stroke="rgb(255,244,170)" stroke-width="2.4"/><line x1="320" y1="455" x2="314.5" y2="465" stroke="rgb(255,244,170)" stroke-width="2.4"/><line x1="320" y1="455" x2="325.5" y2="465" stroke="rgb(255,244,170)" stroke-width="2.4"/><circle cx="368" cy="433" r="5.5" fill="rgb(140,130,100)"/><line x1="368" y1="440" x2="368" y2="455" stroke="rgb(140,130,100)" stroke-width="2.6"/><line x1="361" y1="445" x2="375" y2="445" stroke="rgb(140,130,100)" stroke-width="2.4"/><line x1="368" y1="455" x2="362.5" y2="465" stroke="rgb(140,130,100)" stroke-width="2.4"/><line x1="368" y1="455" x2="373.5" y2="465" stroke="rgb(140,130,100)" stroke-width="2.4"/><rect x="36" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(255,212,94)" stroke-width="1.5"/><text x="111" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif">the serpent</text><text x="111" y="128" font-size="10" text-anchor="middle" dominant-baseline="central" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">hears</text><rect x="200" y="96" width="150" height="42" rx="4" fill="rgb(26,26,38)"/><rect x="200" y="96" width="150" height="42" rx="4" fill="none" stroke="rgb(255,244,170)" stroke-width="2.5" stroke-opacity="0.949"/><text x="275" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(255,244,170)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">the woman</text><text x="275" y="128" font-size="10" text-anchor="middle" dominant-baseline="central" fill="rgb(255,212,94)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">speaks</text><rect x="364" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="439" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">the man</text><rect x="528" y="96" width="150" height="42" rx="4" fill="rgb(16,16,24)" stroke="rgb(74,70,56)" stroke-width="1.5"/><text x="603" y="112" font-size="15" text-anchor="middle" dominant-baseline="central" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif">Yahweh God</text><path d="M275.0,138 Q193.0,164 111.0,138" fill="none" stroke="rgb(255,244,170)" stroke-width="2.5" stroke-opacity="0.898"/><polygon points="111,138 118,146 123,139" fill="rgb(255,244,170)" fill-opacity="0.898"/><text x="716" y="92" font-size="18" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(216,198,143)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">WHAT IS UNDONE</text><text x="716" y="114" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Genesis 2, and the verse that reverses it</text><text x="720" y="142" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">naked, and not ashamed</text><text x="720" y="157" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="157" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">coverings of fig leaves</text><text x="1008" y="157" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:25 → 3:7</text><text x="720" y="200" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">God walking in the garden</text><text x="720" y="215" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="215" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">hidden among the trees</text><text x="1008" y="215" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">3:8</text><text x="720" y="258" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">eat freely of every tree</text><text x="720" y="273" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="273" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">you ate of the one tree</text><text x="1008" y="273" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:16 → 3:12</text><text x="720" y="316" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">to cultivate it and keep it</text><text x="720" y="331" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="331" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">thorns, thistles, and sweat</text><text x="1008" y="331" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:15 → 3:18</text><text x="720" y="374" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">the breath of life</text><text x="720" y="389" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="389" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">to dust you shall return</text><text x="1008" y="389" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:7 → 3:19</text><text x="720" y="432" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.549" font-style="italic">the tree of life at hand</text><text x="720" y="447" font-size="11" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(74,70,56)" font-family="Georgia, 'Times New Roman', serif">↓</text><text x="736" y="447" font-size="12" text-anchor="start" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.588">a sword guards the way</text><text x="1008" y="447" font-size="10" text-anchor="end" dominant-baseline="text-before-edge" fill="rgb(140,130,100)" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.667" font-style="italic">2:9 → 3:24</text></svg>